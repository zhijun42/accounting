[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-accounting"
version = "0.1.0"
description = "Local statement import and auditable personal accounting"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "pdfplumber>=0.11,<1"]

[project.scripts]
accounting = "accounting.__main__:main"

[tool.setuptools]
packages = ["accounting"]

[tool.setuptools.package-data]
accounting = ["schema.sql"]
